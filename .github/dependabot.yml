version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      groups:
          dev-dependencies:
              dependency-type: development
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      groups:
          actions:
              patterns: ["*"]
    - package-ecosystem: npm
      directory: /website
      schedule:
          interval: weekly
      groups:
          website-dependencies:
              patterns: ["*"]
