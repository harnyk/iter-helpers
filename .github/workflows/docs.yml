name: Docs

on:
    push:
        branches: [master]
    pull_request:
        # the API reference is generated from src/ with the root tsconfig and the
        # root dependencies, so changes to them must rebuild the site too
        paths:
            - "website/**"
            - "src/**"
            - "tsconfig.json"
            - "package.json"
            - "pnpm-lock.yaml"
            - ".github/workflows/docs.yml"

permissions:
    contents: read

concurrency:
    group: docs-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: pnpm
                  cache-dependency-path: |
                      pnpm-lock.yaml
                      website/pnpm-lock.yaml
            # the API reference is generated from src/, which imports the root dependencies
            - run: pnpm install --frozen-lockfile
            - run: pnpm install --frozen-lockfile
              working-directory: website
            - run: pnpm test-snippets
              working-directory: website
            - run: pnpm check-snippets
              working-directory: website
            - run: pnpm build
              working-directory: website
            - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              if: github.event_name == 'push'
              with:
                  path: website/build

    deploy:
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
