name: Release

on:
    push:
        tags: ["v*"]

permissions:
    contents: read

jobs:
    publish:
        runs-on: ubuntu-latest
        environment: npm-publish
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: pnpm
                  registry-url: https://registry.npmjs.org
            - name: Use npm with trusted publishing support
              run: npm install -g npm@^11.5.1
            - run: pnpm install --frozen-lockfile
            - run: pnpm lint
            - run: pnpm check-types
            - run: pnpm test
            - run: pnpm test:scripts
            - run: pnpm build
            - run: pnpm check-package
            - name: Verify tag matches package version
              run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
            - name: Publish with provenance
              run: |
                  VERSION="$(node -p "require('./package.json').version")"
                  npm publish --provenance --access public --tag "$(node scripts/dist-tag.mjs "$VERSION")"
